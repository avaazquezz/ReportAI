# Assumes an external Traefik reverse proxy already running on the "web" network,
# with a certificate resolver named "le" already configured at the Traefik level.
# Single-domain routing: ${APP_DOMAIN}/api/* → backend (prefix stripped, backend
# runs with API_ROOT_PATH=/api), everything else → the Nuxt frontend.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# One image for the API and the one-shot migrate job. CI publishes it to GHCR tagged with the
# commit SHA (and `latest` on main); `build:` stays so `up --build` still works from a checkout.
x-backend: &backend
  image: ghcr.io/avaazquezz/reportai-backend:${REPORTAI_TAG:-latest}
  build:
    context: backend
    target: runtime
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: reportai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - reportai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 1g
    logging: *logging
    networks:
      - internal

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: reportai_gotenberg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 2g
    logging: *logging
    networks:
      - internal

  # One-shot: applies Alembic migrations and LangGraph's checkpoint tables, then exits.
  # The API only starts once it has completed successfully (and `make deploy` runs it first).
  migrate:
    <<: *backend
    container_name: reportai_migrate
    command: sh -c "alembic upgrade head && python scripts/setup_checkpointer.py"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging
    networks:
      - internal

  backend:
    <<: *backend
    container_name: reportai_backend
    volumes:
      - reportai_storage_data:/app/storage
    restart: always
    mem_limit: 1g
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.reportai-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.reportai-api.entrypoints=websecure"
      - "traefik.http.routers.reportai-api.tls.certresolver=le"
      - "traefik.http.routers.reportai-api.priority=10"
      - "traefik.http.routers.reportai-api.middlewares=reportai-api-strip@docker,reportai-api-headers@docker"
      - "traefik.http.services.reportai-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.reportai-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.reportai-api-headers.headers.customresponseheaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.reportai-api-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.reportai-api-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"

  # Runs the reports: transcription, the model, rendering, delivery. A deploy stops it gracefully
  # (it finishes the job in hand); whatever it cannot finish resumes on the next worker.
  worker:
    <<: *backend
    container_name: reportai_worker
    command: python -m app.worker
    volumes:
      - reportai_storage_data:/app/storage
    restart: always
    stop_grace_period: 5m
    # The image's check calls the API on :8000, which the worker doesn't serve: it would read
    # "unhealthy" forever while working fine.
    healthcheck:
      disable: true
    mem_limit: 1g
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  frontend:
    image: ghcr.io/avaazquezz/reportai-frontend:${REPORTAI_TAG:-latest}
    build:
      context: frontend
    container_name: reportai_frontend
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_SERVER: http://backend:8000
      NUXT_PUBLIC_LEGAL_NAME: ${LEGAL_NAME:-}
      NUXT_PUBLIC_LEGAL_ID: ${LEGAL_ID:-}
      NUXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
    restart: always
    mem_limit: 512m
    logging: *logging
    depends_on:
      - backend
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.reportai-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.reportai-web.entrypoints=websecure"
      - "traefik.http.routers.reportai-web.tls.certresolver=le"
      - "traefik.http.routers.reportai-web.priority=1"
      - "traefik.http.services.reportai-web.loadbalancer.server.port=3000"
      # One http→https redirect for the whole host — /api requests redirect here
      # too, then the https routers split them by prefix.
      - "traefik.http.routers.reportai-web-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.reportai-web-http.entrypoints=web"
      - "traefik.http.routers.reportai-web-http.middlewares=reportai-https-redirect@docker"
      - "traefik.http.middlewares.reportai-https-redirect.redirectscheme.scheme=https"

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  reportai_postgres_data:
    name: reportai_postgres_data
  reportai_storage_data:
    name: reportai_storage_data
