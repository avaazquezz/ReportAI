services:
  postgres:
    image: postgres:16-alpine
    container_name: reportai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - reportai_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - reportai_net

  backend:
    build:
      context: ../backend
      target: builder
    container_name: reportai_backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reportai_net

networks:
  reportai_net:
    driver: bridge

volumes:
  reportai_postgres_data:
    name: reportai_postgres_data
