# ReportAI on a company's own server, as install.sh sets it up: everything ReportAI needs, Caddy
# in front (automatic HTTPS when the installation has a domain), nothing else on the machine.
# Settings live in .env next to this file; `reportai update` changes REPORTAI_VERSION and restarts.
name: ${COMPOSE_PROJECT_NAME:-reportai}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${REPORTAI_IMAGE_PREFIX:-ghcr.io/avaazquezz}/reportai-backend:${REPORTAI_VERSION}
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    GOTENBERG_URL: http://gotenberg:3000
    DOCUMENT_STORAGE_PATH: /app/storage
    API_ROOT_PATH: /api
    ENVIRONMENT: production
    SINGLE_TENANT: "true"
  volumes:
    - storage:/app/storage
  logging: *logging
  networks: [internal]

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    logging: *logging
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [internal]

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [internal]

  # One-shot, before every start: database migrations and LangGraph's checkpoint tables.
  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python scripts/setup_checkpointer.py"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs the reports, and polls Telegram when the installation has no public address.
  worker:
    <<: *backend
    command: python -m app.worker
    restart: unless-stopped
    stop_grace_period: 5m
    # The image's check calls the API on :8000, which the worker doesn't serve: it would read
    # "unhealthy" forever while working fine.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${REPORTAI_IMAGE_PREFIX:-ghcr.io/avaazquezz}/reportai-frontend:${REPORTAI_VERSION}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_SERVER: http://backend:8000
      NUXT_PUBLIC_SECURE_COOKIES: ${SECURE_COOKIES:-true}
    depends_on: [backend]
    logging: *logging
    networks: [internal]

networks:
  internal:

# Not reportai_postgres_data / reportai_storage_data: those belong to the development compose.
volumes:
  database:
  storage:
  caddy_data:
  caddy_config:
