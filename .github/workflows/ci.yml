name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reportai
          POSTGRES_PASSWORD: reportai_ci
          POSTGRES_DB: reportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reportai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: reportai
      POSTGRES_PASSWORD: reportai_ci
      POSTGRES_DB: reportai
      SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-real
      ENVIRONMENT: testing
      ANTHROPIC_API_KEY: ci-dummy
      TRANSCRIPTION_API_KEY: ci-dummy
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM_ADDRESS: ci@example.com
      WHATSAPP_APP_SECRET: ci-dummy
      WHATSAPP_VERIFY_TOKEN: ci-dummy
      MAILGUN_API_KEY: ci-dummy
      MAILGUN_SIGNING_KEY: ci-dummy
      MAILGUN_INBOUND_DOMAIN: inbound.ci.example.com

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Exactly the versions in uv.lock — what the published image ships, not whatever
      # the `>=` ranges in pyproject.toml resolve to today.
      - name: Install dependencies
        run: |
          pip install uv==0.12.5
          uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Type check (mypy)
        run: uv run --frozen mypy app

      - name: Apply migrations
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen python scripts/setup_checkpointer.py

      - name: Migrations match the models
        run: uv run --frozen alembic check

      # The suite's time budget (it takes 4-8 min locally; the slowest steps are printed below): a
      # fixture that makes every test slow fails the pull request instead of quietly costing minutes.
      - name: Run tests
        timeout-minutes: 20
        run: uv run --frozen pytest -v -m "not eval" --durations=20

  backend-image:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --target runtime -t reportai-backend:ci backend

      # The production container runs as a non-root user; a storage volume owned by root
      # made every upload fail while dev (running as root) looked fine.
      - name: The app user can write to a fresh storage volume
        run: docker run --rm -v ci_storage:/app/storage reportai-backend:ci sh -c 'echo ok > /app/storage/probe'

  frontend:
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the built server (CSP nonce, security headers)
        run: npm run test:smoke

  # The product's main flow in a real browser: sign in, type a note, review and correct the fields,
  # approve, download the PDF and find it in the recipient's mailbox. Against the production images
  # laid out as a self-hosted installation (infra/docker-compose.e2e.yml), with the AI provider
  # replaced by a local stub: no key, no cost. The paid eval (eval.yml) never runs here.
  e2e:
    runs-on: ubuntu-26.04

    env:
      E2E_COMPOSE: docker compose -f infra/docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and start the stack
        run: $E2E_COMPOSE up -d --build --wait --wait-timeout 300

      - name: Set up the installation (setup wizard, document type, recipient)
        run: $E2E_COMPOSE run --rm seed

      - name: Run the end-to-end test
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect the services' logs
        if: failure()
        run: |
          mkdir -p frontend/test-results
          $E2E_COMPOSE logs --no-color --timestamps > frontend/test-results/services.log 2>&1

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: $E2E_COMPOSE down -v --remove-orphans
