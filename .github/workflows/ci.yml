name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reportai
          POSTGRES_PASSWORD: reportai_ci
          POSTGRES_DB: reportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reportai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: reportai
      POSTGRES_PASSWORD: reportai_ci
      POSTGRES_DB: reportai
      SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-real
      ENVIRONMENT: testing

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
