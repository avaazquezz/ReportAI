name: Publish images

# Every push to main (and every version tag) publishes the backend and frontend images to
# GHCR, tagged with the commit SHA. A server then updates with `make deploy` — pull, migrate,
# restart — instead of building on the machine that runs production.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write  # the GitHub release a version tag gets, which installations check for updates
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reportai-backend
            context: backend
            target: runtime
          - name: reportai-frontend
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # A version tag v1.4.2 publishes 1.4.2: the tag an installation's REPORTAI_VERSION names.
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPORTAI_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Installations look for updates in the repository's latest GitHub release.
  release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
