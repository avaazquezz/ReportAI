name: Eval

# Manual only — the golden-set costs real Anthropic API calls and depends on an
# external service, so it never gates a regular push (see .github/workflows/ci.yml).
on:
  workflow_dispatch:

jobs:
  golden-set:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reportai
          POSTGRES_PASSWORD: reportai_ci
          POSTGRES_DB: reportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reportai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: reportai
      POSTGRES_PASSWORD: reportai_ci
      POSTGRES_DB: reportai
      SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-real
      ENVIRONMENT: testing
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM_ADDRESS: ci@example.com
      WHATSAPP_APP_SECRET: ci-dummy
      WHATSAPP_VERIFY_TOKEN: ci-dummy
      MAILGUN_API_KEY: ci-dummy
      MAILGUN_SIGNING_KEY: ci-dummy
      MAILGUN_INBOUND_DOMAIN: inbound.ci.example.com

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden-set eval
        run: pytest -v -m eval
